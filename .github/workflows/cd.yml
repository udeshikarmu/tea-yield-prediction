name: CD Deploy to Azure Container Apps (Keyless OIDC)

on:
  push:
    branches: [ main, master, feature/initial-setup ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build_publish_deploy:
    runs-on: ubuntu-latest
    environment: production   # Enforces Human Approval Reviewer before deploying to production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push FastAPI Image
        run: |
          IMAGE_TAG=$(echo "ghcr.io/${{ github.repository }}/tea-api:latest" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMAGE_TAG -f app/Dockerfile .
          docker push $IMAGE_TAG

      - name: Azure Login via OIDC (Keyless Authentication)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure GHCR credentials for Azure Container Apps
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          az containerapp registry set \
            --name tea-harvest-service \
            --resource-group rg-tea-mlops \
            --server ghcr.io \
            --username "$GHCR_USERNAME" \
            --password "$GHCR_TOKEN"

      - name: Deploy to Azure Container Apps
        run: |
          IMAGE_TAG=$(echo "ghcr.io/${{ github.repository }}/tea-api:latest" | tr '[:upper:]' '[:lower:]')
          az containerapp update \
            --name tea-harvest-service \
            --resource-group rg-tea-mlops \
            --image $IMAGE_TAG
