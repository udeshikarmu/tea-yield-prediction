name: CD Deploy to Azure Container Apps (Keyless OIDC)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build_publish_deploy:
    runs-on: ubuntu-latest
    environment: production   # Enforces Human Approval Reviewer before deploying to production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push FastAPI Image
        run: |
          IMAGE_TAG=$(echo "ghcr.io/${{ github.repository }}/tea-api:latest" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMAGE_TAG -f app/Dockerfile .
          docker push $IMAGE_TAG

      - name: Azure Login via OIDC (Keyless Authentication)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        run: |
          IMAGE_TAG=$(echo "ghcr.io/${{ github.repository }}/tea-api:latest" | tr '[:upper:]' '[:lower:]')
          az containerapp create \
            --name tea-harvest-service \
            --resource-group rg-tea-mlops \
            --environment env-tea-mlops \
            --image $IMAGE_TAG \
            --registry-server ghcr.io \
            --registry-username ${{ github.actor }} \
            --registry-password ${{ secrets.GITHUB_TOKEN }} \
            --target-port 8000 \
            --ingress external \
            --revisions-mode single
