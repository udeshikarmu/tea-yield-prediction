name: CD Deploy to Azure Container Apps (Keyless OIDC)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build_publish_deploy:
    runs-on: ubuntu-latest
    environment: production   # Enforces Human Approval Reviewer before deploying to production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push FastAPI Image
        run: |
          IMAGE_TAG=ghcr.io/${{ github.repository }}/tea-api:latest
          docker build -t $IMAGE_TAG -f app/Dockerfile .
          docker push $IMAGE_TAG

      - name: Azure Login via OIDC (Keyless Authentication)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Canary Revision to Azure Container Apps
        run: |
          az containerapp update \
            --name tea-harvest-service \
            --resource-group rg-tea-mlops \
            --image ghcr.io/${{ github.repository }}/tea-api:latest
